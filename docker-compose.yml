services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp-bot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_bot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: whatsapp-bot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optional: run FastAPI WhatsApp agent separately (see agent/README.md)
  # agent:
  #   build: ./agent
  #   ports:
  #     - "8000:8000"
  #   env_file: ./agent/.env

volumes:
  postgres_data:
  redis_data:
